defaults:
  - _self_
  - dataset: crack_vision_12k
  - aug: resnet_trans
  - loss: ce_smooth_topk
  - model: ifa 
  - metric: 
      - monitor
      - iou
      - errmat_based


experiment:
  project: crack_cd_fss
  uuid: ${now:%m%d_%H%M%S}@${experiment.comment}
  comment: null_comment
  save_dir: ${hydra:runtime.cwd}/logs/${experiment.uuid}
  seed: 2025

  n_shot: 1

hydra:
  run:
    dir: ${experiment.save_dir}/hydra_output

checkpoint:
  _target_: src.callback.checkpoint.Checkpoint
  output_path: ${experiment.save_dir}/checkpoints
  exp_id: ${experiment.uuid}
  monitor: mIoU
  topk_models: 2
  

loader:
  # torch Dataloader zone
  batch_size: 1
  num_workers: 16
  persistent_workers: True

  # customized keywords, should be removed if using regular loader
  train_epoch_splits: 12


optimizer:
  name: Adam
  optimizer_params:
    lr: 0.00001
    weight_decay: 0


scheduler:
  name: OneCycleLR
  scheduler_params:
    div_factor: 10                                      # starts at lr / 10
    pct_start: 0.3                                      # reaches lr at 30% of total steps
    final_div_factor: 10                                # ends at lr / 10 / 10
    max_lr: ${optimizer.optimizer_params.lr}
    epochs: ${trainer.max_epochs}
    steps_per_epoch: ???
    cycle_momentum: False


trainer:
  max_epochs: 40
  log_every_n_steps: 50

  num_nodes: 1
  devices: -1
  precision: 32

  limit_train_batches: 1.0
  limit_val_batches: 1.0
  check_val_every_n_epoch: 1
  val_check_interval: 1.0
  num_sanity_val_steps: 0